<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>EPYC Driver</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: #fff; color: #111827; }
      main { max-width: 28rem; margin: 0 auto; padding: 4rem 1.5rem; text-align: center; }
      h1 { font-size: 1.5rem; margin: 0 0 1rem; }
      p { font-size: 1.0625rem; line-height: 1.5; color: #374151; }
      button { margin-top: 1.5rem; min-height: 48px; padding: 0 1.5rem; font-size: 1.0625rem; font-weight: 600;
        color: #fff; background: #065f46; border: 0; border-radius: 0.5rem; }
      button:focus-visible { outline: 3px solid #065f46; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>No connection</h1>
      <p role="status">EPYC Driver needs the internet to load your jobs. Check your signal or Wi-Fi, then try again.</p>
      <button type="button" onclick="location.replace('https://www.epyccs.com/driver/jobs')">Try again</button>
    </main>
  </body>
</html>
